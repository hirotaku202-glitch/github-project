<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WEB予約 — GIL 美容複合サロングループ</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="nav">
    <a class="nav-logo" href="index.html">
      <img src="../assets/logo.svg" alt="GIL" />
    </a>
    <nav class="nav-links">
      <a href="index.html#brands">ブランド</a>
      <a href="index.html#stores">店舗</a>
      <a class="nav-cta" href="booking.html">予約する</a>
    </nav>
  </header>

  <section class="section">
    <div class="container narrow">
      <p class="kicker">WEB BOOKING</p>
      <h2>WEB予約</h2>
      <p class="lead">店舗・ブランド・メニューを選んでご予約ください。</p>

      <form class="booking-form" id="bookingForm">
        <label>店舗
          <select name="store" id="storeSelect" required>
            <option value="">選択してください</option>
          </select>
        </label>
        <label>ブランド（メニューの種類）
          <select name="brand" id="brandSelect" required>
            <option value="">先に店舗を選択してください</option>
          </select>
        </label>
        <label>メニュー
          <select name="menu" id="menuSelect" required>
            <option value="">先にブランドを選択してください</option>
          </select>
        </label>
        <label>ご希望日時
          <input type="datetime-local" name="datetime" required />
        </label>
        <label>お名前
          <input type="text" name="name" placeholder="山田 花子" required />
        </label>
        <label>電話番号
          <input type="tel" name="phone" placeholder="090-1234-5678" required />
        </label>
        <label>メールアドレス（任意）
          <input type="email" name="email" placeholder="example@mail.com" />
        </label>
        <label>ご要望（任意）
          <textarea name="note" rows="3" placeholder="ご相談やご希望があればご記入ください"></textarea>
        </label>
        <button type="submit" class="btn">この内容で予約する</button>
      </form>

      <div class="booking-done" id="bookingDone" hidden>
        <h3>ご予約を受け付けました</h3>
        <p id="doneSummary"></p>
        <p class="small">店舗より確認のご連絡を差し上げます。</p>
        <a class="btn ghost" href="index.html">トップへ戻る</a>
        <button class="btn ghost" id="againBtn" type="button">続けて予約する</button>
      </div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <img src="../assets/logo.svg" alt="GIL" class="footer-logo" />
      <p>美容複合サロングループ GIL</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
